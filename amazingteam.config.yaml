# AmazingTeam Project Configuration
# Generated by amazingteam init

version: "1.0"

project:
  name: "amazingwyn"
  description: "My awesome project"
  language: "typescript"
  framework: "node"

llm:
  model: "bailian-coding-plan/glm-5"
  small_model: "bailian-coding-plan/glm-5"
  base_url: "https://coding.dashscope.aliyuncs.com/apps/anthropic/v1"
  # API key is set via environment variable: AMAZINGTEAM_API_KEY

amazingteam:
  version: "3.0.9"

workflow:
  commit_mode: "pr"
  pr:
    auto_merge: false
    require_review: true
    reviewers: []
  direct:
    require_ci_pass: true

build:
  command: "npm run build"
  test: "npm test"
  lint: "npm run lint"

# Uncomment to use an overlay:
# overlay: ""

# Custom rules (optional)
rules:
  test_coverage_threshold: 80
  max_function_lines: 30
