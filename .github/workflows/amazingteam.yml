# AmazingTeam GitHub Action Workflow
# This workflow enables AI-powered development in your repository

name: AmazingTeam

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  amazing-team:
    if: |
      startsWith(github.event.comment.body, '/ai') ||
      startsWith(github.event.comment.body, '/opencode') ||
      startsWith(github.event.comment.body, '/oc')
    
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config --global user.name "opencode-bot"
          git config --global user.email "opencode-bot@users.noreply.github.com"

      - name: Setup AmazingTeam
        uses: Burburton/amazingteam-action@v3.0.20
        with:
          version: '3.0.20'
          config: 'amazingteam.config.yaml'

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          AMAZINGTEAM_API_KEY: ${{ secrets.AMAZINGTEAM_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.AMAZINGTEAM_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: bailian-coding-plan/glm-5
          use_github_token: true
